# Jekyll Configuration File
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

## => Site Settings
text_skin: default
highlight_theme: default
url     : "https://sparktex.github.io"
baseurl : ""
title   : Sparktex
description: > # this means to ignore newlines until "baseurl:"
  Welcome to my site.

## => Language and Timezone
lang:
timezone:

## => Author and Social
author:
  type    :
  name    : Sparktex
  github  : sparktex

## => GitHub Repository
repository: sparktex/sparktex.github.io
repository_tree: main

## => Paths
paths:
  root    :
  home    :
  archive :
  rss     :

## => Post
excerpt_separator: <!--more-->
license: CC-BY-NC-4.0
toc:
  selectors:

## => Markdown Enhancements
mathjax: true
mathjax_autoNumber: false
mermaid:
chart:

## => Paginate
paginate: 8
paginate_path: /page:num

## => Sources
sources: unpkg

## => Sharing
sharing:
  provider: false

## => Comments
comments:
  provider: false

## => Pageview
pageview:
  provider: false

## => Search
search:
  provider: default

## => Analytics
analytics:
  provider: false

## => Build
theme       : jekyll-text-theme
markdown    : kramdown
highlighter : rouge
permalink   : date

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: article
      sharing: true
      license: true
      aside:
        toc: true
      show_edit_on_github: false
      show_subscribe: false
      pageview: false

## => Plugins
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap
  - jemoji
